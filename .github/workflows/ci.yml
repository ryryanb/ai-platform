name: CI

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: chat_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d chat_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/chat_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_DOCKER_COMPOSE_ENABLED: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Generate ephemeral RSA key pair for security configuration tests
        run: |
          mkdir -p "$RUNNER_TEMP/ai-platform-jwt"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$RUNNER_TEMP/ai-platform-jwt/private.pem"
          openssl pkey -in "$RUNNER_TEMP/ai-platform-jwt/private.pem" -pubout -out "$RUNNER_TEMP/ai-platform-jwt/public.pem"
          echo "JWT_PUBLIC_KEY_PATH=file:$RUNNER_TEMP/ai-platform-jwt/public.pem" >> "$GITHUB_ENV"

      - name: Build and test backend
        run: ./mvnw verify

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build and validate frontend
        working-directory: frontend
        run: npm run validate