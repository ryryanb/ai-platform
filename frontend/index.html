<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Adjust the title as you like -->
    <title>AI Platform Frontend</title>
    <!-- Vite injects the script tag for you during dev, but we need a placeholder for the build -->
    %sveltekit.head% <!-- (optional – keep for frameworks that use it) -->
  </head>
  <body>
    <div id="root"><!-- React / Vue / Svelte will mount here --></div>

    <!-- The entry point that Vite will replace with the bundled script(s) -->
    <script type="module" src="/src/main.tsx"></script>
    <!-- If you use TypeScript, change the extension to .tsx or .ts -->
    <!-- For vanilla JS you might have src/main.js instead -->
  </body>
</html>
